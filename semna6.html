<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formulario de Registro</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    background-color: rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Título centrado */
  h2 {
    text-align: center;
    margin-bottom: 20px;
  }

  /* Modal container */
  .modal {
    background-color: #fff;
    padding: 30px;
    border-radius: 8px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    position: relative;
  }

  /* Título dentro del modal */
  /* Ya está en h2, pero si quieres que esté en centro, ya está definido */

  form {
    display: flex;
    flex-direction: column;
  }

  .form-group {
    margin-bottom: 15px;
  }

  label {
    display: block;
    margin-bottom: 5px;
  }

  input {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
    border: 2px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }

  input.valid {
    border-color: green;
    background-color: #e0ffe0;
  }

  input.invalid {
    border-color: red;
    background-color: #ffe0e0;
  }

  .error-message {
    color: red;
    font-size: 12px;
    height: 14px;
    margin-top: 2px;
  }

  /* Botones */
  button {
    padding: 10px 20px;
    font-size: 14px;
    margin-top: 10px;
    cursor: pointer;
  }

  button:disabled {
    background-color: #ccc;
    cursor: not-allowed;
  }

  /* Opcional: botón para cerrar (si quieres un modal con cierre) */
  /* .close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
  } */
</style>
</head>
<body>

<div class="modal">
  <h2>Formulario de Registro</h2>
  <form id="registroForm" novalidate>
    <div class="form-group">
      <label for="nombre">Nombre *</label>
      <input type="text" id="nombre" name="nombre" />
      <div class="error-message" id="nombre-error"></div>
    </div>
    
    <div class="form-group">
      <label for="correo">Correo Electrónico *</label>
      <input type="email" id="correo" name="correo" />
      <div class="error-message" id="correo-error"></div>
    </div>
    
    <div class="form-group">
      <label for="password">Contraseña *</label>
      <input type="password" id="password" name="password" />
      <div class="error-message" id="password-error"></div>
    </div>
    
    <div class="form-group">
      <label for="confirmPassword">Confirmar Contraseña *</label>
      <input type="password" id="confirmPassword" name="confirmPassword" />
      <div class="error-message" id="confirmPassword-error"></div>
    </div>
    
    <div class="form-group">
      <label for="edad">Edad *</label>
      <input type="number" id="edad" name="edad" />
      <div class="error-message" id="edad-error"></div>
    </div>
    
    <button type="submit" id="enviar" disabled>Enviar</button>
    <button type="button" id="reiniciar">Reiniciar</button>
  </form>
</div>

<script>
  const form = document.getElementById('registroForm');
  const nombreInput = document.getElementById('nombre');
  const correoInput = document.getElementById('correo');
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirmPassword');
  const edadInput = document.getElementById('edad');
  const btnEnviar = document.getElementById('enviar');
  const btnReiniciar = document.getElementById('reiniciar');

  const errores = {
    nombre: false,
    correo: false,
    password: false,
    confirmPassword: false,
    edad: false
  };

  function validarNombre() {
    const valor = nombreInput.value.trim();
    const errorDiv = document.getElementById('nombre-error');
    if (valor.length >= 3) {
      errorDiv.textContent = '';
      nombreInput.className = 'valid';
      errores.nombre = true;
    } else {
      errorDiv.textContent = 'El nombre debe tener al menos 3 caracteres.';
      nombreInput.className = 'invalid';
      errores.nombre = false;
    }
    actualizarBoton();
  }

  function validarCorreo() {
    const valor = correoInput.value.trim();
    const errorDiv = document.getElementById('correo-error');
    const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (regex.test(valor)) {
      errorDiv.textContent = '';
      correoInput.className = 'valid';
      errores.correo = true;
    } else {
      errorDiv.textContent = 'Formato de correo inválido.';
      correoInput.className = 'invalid';
      errores.correo = false;
    }
    actualizarBoton();
  }

  function validarPassword() {
    const valor = passwordInput.value;
    const errorDiv = document.getElementById('password-error');
    const regexNumero = /[0-9]/;
    const regexEspecial = /[^A-Za-z0-9]/;
    if (valor.length >= 8 && regexNumero.test(valor) && regexEspecial.test(valor)) {
      errorDiv.textContent = '';
      passwordInput.className = 'valid';
      errores.password = true;
    } else {
      errorDiv.textContent = 'La contraseña debe tener mínimo 8 caracteres, un número y un carácter especial.';
      passwordInput.className = 'invalid';
      errores.password = false;
    }
    validarConfirmacion();
    actualizarBoton();
  }

  function validarConfirmacion() {
    const valorPassword = passwordInput.value;
    const valorConfirm = confirmPasswordInput.value;
    const errorDiv = document.getElementById('confirmPassword-error');
    if (valorConfirm === valorPassword && errores.password) {
      errorDiv.textContent = '';
      confirmPasswordInput.className = 'valid';
      errores.confirmPassword = true;
    } else {
      errorDiv.textContent = 'Las contraseñas no coinciden.';
      confirmPasswordInput.className = 'invalid';
      errores.confirmPassword = false;
    }
    actualizarBoton();
  }

  function validarEdad() {
    const valor = parseInt(edadInput.value, 10);
    const errorDiv = document.getElementById('edad-error');
    if (!isNaN(valor) && valor >= 18) {
      errorDiv.textContent = '';
      edadInput.className = 'valid';
      errores.edad = true;
    } else {
      errorDiv.textContent = 'Debe ser mayor o igual a 18 años.';
      edadInput.className = 'invalid';
      errores.edad = false;
    }
    actualizarBoton();
  }

  function actualizarBoton() {
    const todosValidos = Object.values(errores).every(v => v === true);
    btnEnviar.disabled = !todosValidos;
  }

  // Eventos en tiempo real
  nombreInput.addEventListener('input', validarNombre);
  correoInput.addEventListener('input', validarCorreo);
  passwordInput.addEventListener('input', validarPassword);
  confirmPasswordInput.addEventListener('input', validarConfirmacion);
  edadInput.addEventListener('input', validarEdad);

  // Reiniciar formulario
  document.getElementById('reiniciar').addEventListener('click', () => {
    form.reset();
    // Resetear estilos y errores
    for (const key in errores) {
      errores[key] = false;
    }
    document.querySelectorAll('input').forEach(input => {
      input.className = '';
    });
    document.querySelectorAll('.error-message').forEach(div => {
      div.textContent = '';
    });
    btnEnviar.disabled = true;
  });

  // Validar en submit
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    alert('¡Formulario enviado con éxito!');
  });
</script>

</body>
</html>
